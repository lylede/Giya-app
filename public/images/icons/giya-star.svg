<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
  class="chatbot-icon"

  <!-- Main chat bubble -->
  <path
    d="M70 120
       C70 80 102 48 142 48
       H330
       C370 48 402 80 402 120
       V280
       C402 320 370 352 330 352
       H190
       L112 414
       V352
       C88 344 70 322 70 294
       Z"
    stroke="currentColor"
    stroke-width="24"
    stroke-linejoin="round"
  />

  <!-- Robot head -->
  <rect
    x="200"
    y="110"
    width="230"
    height="170"
    rx="55"
    stroke="currentColor"
    stroke-width="24"
  />

  <!-- Robot ears -->
  <rect
    x="178"
    y="155"
    width="32"
    height="80"
    rx="16"
    fill="currentColor"
  />

  <rect
    x="420"
    y="155"
    width="32"
    height="80"
    rx="16"
    fill="currentColor"
  />

  <!-- Antenna -->
  <path
    d="M315 110 V65"
    stroke="currentColor"
    stroke-width="20"
    stroke-linecap="round"
  />

  <circle
    cx="315"
    cy="45"
    r="22"
    fill="currentColor"
  />

  <!-- Eyes -->
  <circle cx="270" cy="185" r="14" fill="currentColor" />
  <circle cx="360" cy="185" r="14" fill="currentColor" />

  <!-- Smile -->
  <path
    d="M285 225
       C300 245 330 245 345 225"
    stroke="currentColor"
    stroke-width="16"
    stroke-linecap="round"
  />

  <!-- Small chat bubble -->
  <path
    d="M260 310
       H408
       C432 310 450 328 450 352
       V398
       C450 422 432 440 408 440
       H340
       L292 475
       V440
       H260
       C236 440 218 422 218 398
       V352
       C218 328 236 310 260 310
       Z"
    stroke="currentColor"
    stroke-width="20"
    stroke-linejoin="round"
  />

  <!-- Typing dots -->
  <circle cx="285" cy="375" r="10" fill="currentColor" />
  <circle cx="335" cy="375" r="10" fill="currentColor" />
  <circle cx="385" cy="375" r="10" fill="currentColor" />
</svg>
